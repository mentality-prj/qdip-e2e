name: Doctor external OAuth client allowlist release QA
on:
  push:
    branches: [test/doctor-external-id-release-20261015]
    paths: [.github/workflows/doctor-external-allowlist-once.yml]
permissions:
  contents: read
jobs:
  doctor:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing user secret bindings without printing values
        env:
          QA1_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_LOGIN }}
          QA1_PASSWORD_BOUND: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD != '' }}
          AUTH_LOGIN_BOUND: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN != '' }}
          AUTH_PASSWORD_BOUND: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test "${QA1_LOGIN,,}" = "qa1@qdip.ai"
          test "$QA1_PASSWORD_BOUND" = "true"
          test "$AUTH_LOGIN_BOUND" = "true"
          test "$AUTH_PASSWORD_BOUND" = "true"
          echo 'DOCTOR_P1_EXTERNAL_CLIENT_QA_SECRETS_BOUND=PASS'
      - name: Verify existing browser test syntax
        run: |
          node --check scripts/doctor_p1_external_mcp.mjs
          node --check scripts/doctor_roleless_qa1_live.mjs
          node --check scripts/doctor_p1_repair_live_user.mjs
      - name: Independent production MCP OAuth challenge and negative bearer
        run: node scripts/doctor_p1_external_mcp.mjs
      - name: Install isolated Chromium
        run: |
          set -euo pipefail
          mkdir -p /tmp/doctor-ext-allowlist
          cp scripts/doctor_roleless_qa1_live.mjs scripts/doctor_p1_repair_live_user.mjs /tmp/doctor-ext-allowlist/
          cd /tmp/doctor-ext-allowlist
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Real QA1 no-role Zitadel login must be denied
        env:
          QDIP_E2E_ZITADEL_QA1_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD }}
        run: |
          cd /tmp/doctor-ext-allowlist
          node doctor_roleless_qa1_live.mjs
      - name: Real authorized Zitadel login and solver
        env:
          QDIP_E2E_ZITADEL_TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
          QDIP_E2E_ZITADEL_TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
        run: |
          cd /tmp/doctor-ext-allowlist
          node doctor_p1_repair_live_user.mjs
      - name: Note live external OAuth limitation
        run: echo 'DOCTOR_P1_NEW_OAUTH_CLIENT_TOKEN_EXCHANGE=NOT_TESTED'
