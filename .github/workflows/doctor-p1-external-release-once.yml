name: Doctor P1 external OAuth production release gate
on:
  push:
    branches: [test/doctor-p1-external-oauth-prod-release-20261015]
    paths: [.github/workflows/doctor-p1-external-release-once.yml]
permissions:
  contents: read
jobs:
  mcp-oauth-release:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing sealed QA1 and allowed identity binding
        env:
          QA1_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_LOGIN }}
          QA1_PASSWORD_BOUND: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD != '' }}
          AUTH_LOGIN_BOUND: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN != '' }}
          AUTH_PASSWORD_BOUND: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${QA1_LOGIN,,}" != 'qa1@qdip.ai' ] || [ "$QA1_PASSWORD_BOUND" != 'true' ]; then
            echo 'DOCTOR_EXT_MCP_QA1_BINDING=BLOCKED'
            exit 2
          fi
          if [ "$AUTH_LOGIN_BOUND" != 'true' ] || [ "$AUTH_PASSWORD_BOUND" != 'true' ]; then
            echo 'DOCTOR_EXT_MCP_AUTH_BINDING=BLOCKED'
            exit 2
          fi
          echo 'DOCTOR_EXT_MCP_RELEASE_IDENTITIES=PASS'
      - name: Validate E2E script syntax
        run: |
          node --check scripts/doctor_p1_external_mcp.mjs
          node --check scripts/doctor_roleless_qa1_live.mjs
          node --check scripts/doctor_p1_repair_live_user.mjs
      - name: Check public external MCP OAuth resource/invalid-token gate
        run: node scripts/doctor_p1_external_mcp.mjs
      - name: Install isolated Chromium for real Zitadel users
        run: |
          mkdir -p /tmp/doctor-ext-mcp-release
          cp scripts/doctor_roleless_qa1_live.mjs scripts/doctor_p1_repair_live_user.mjs /tmp/doctor-ext-mcp-release/
          cd /tmp/doctor-ext-mcp-release
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Real Zitadel QA1 must not create an authorized Doctor session
        env:
          QDIP_E2E_ZITADEL_QA1_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST1_PASSWORD }}
        run: |
          cd /tmp/doctor-ext-mcp-release
          node doctor_roleless_qa1_live.mjs
      - name: Genuine Zitadel authorized user end to end
        env:
          QDIP_E2E_ZITADEL_TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
          QDIP_E2E_ZITADEL_TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
        run: |
          cd /tmp/doctor-ext-mcp-release
          node doctor_p1_repair_live_user.mjs
      - name: Explicit external consent qualification boundary
        run: echo 'DOCTOR_P1_REAL_THIRD_PARTY_MCP_CONSENT=NOT_TESTED'
