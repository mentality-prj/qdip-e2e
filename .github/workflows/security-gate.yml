name: QDIP Independent Security Gate
run-name: Static Security Gate ${{ inputs.target }} @ ${{ inputs.source_ref }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Allowlisted QDIP repository"
        type: choice
        required: true
        options: [vhv, core, web, doctor]
        default: vhv
      source_ref:
        description: "Source ref / 40-char SHA (use immutable SHA for release qualification)"
        type: string
        required: true
        default: dev
      expected_sha:
        description: "Optional exact 40-char source SHA; refuse a mismatched source ref"
        type: string
        required: false

# Explicit manual-only gate. Never runs AI or installs/executes target source code.
# GitHub-hosted Actions and vulnerability DB downloads may still consume runner/network quotas.
permissions:
  contents: read

concurrency:
  group: qdip-static-security-${{ inputs.target }}-${{ inputs.source_ref }}
  cancel-in-progress: false

jobs:
  deterministic-audit:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      SECURITY_TARGET: ${{ inputs.target }}
      SOURCE_REF: ${{ inputs.source_ref }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      SOURCE_DIR: ${{ github.workspace }}/target
    steps:
      - name: Checkout public independent E2E security tooling
        uses: actions/checkout@v4
        with:
          path: suite
          persist-credentials: false

      - name: Initialize private report workspace
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "GATE_REPORT_DIR=$RUNNER_TEMP/qdip-security-private"
            echo "SANITIZED_DIR=$RUNNER_TEMP/qdip-security-public"
            echo "GATE_TOOLS_BIN=$RUNNER_TEMP/qdip-security-bin"
            echo "GATE_SEMGREP_CONFIG=$GITHUB_WORKSPACE/suite/security/semgrep.yml"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/qdip-security-private" "$RUNNER_TEMP/qdip-security-public" "$RUNNER_TEMP/qdip-security-bin"
          chmod 700 "$RUNNER_TEMP/qdip-security-private" "$RUNNER_TEMP/qdip-security-public"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate target allowlist and ref before accessing secrets
        run: node suite/scripts/security_gate.mjs validate-input

      - name: Checkout private source at requested revision, read-only
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target == 'vhv' && 'qdip-ai/qdip-personal-secretary' || inputs.target == 'core' && 'qdip-ai/qdip-core' || inputs.target == 'web' && 'qdip-ai/qdip-web' || 'qdip-ai/qdip-model-doctor' }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.QDIP_READ_TOKEN }}
          path: target
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.4'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pinned OSS Gitleaks and Semgrep (not source packages)
        shell: bash
        run: |
          set -euo pipefail
          export GOBIN="$GATE_TOOLS_BIN"
          go install github.com/zricethezav/gitleaks/v8@v8.24.3 > "$GATE_REPORT_DIR/gitleaks-install.private.log" 2>&1
          python -m venv "$RUNNER_TEMP/qdip-security-venv"
          "$RUNNER_TEMP/qdip-security-venv/bin/python" -m pip install --disable-pip-version-check --no-input semgrep==1.134.0 > "$GATE_REPORT_DIR/semgrep-install.private.log" 2>&1
          ln -s "$RUNNER_TEMP/qdip-security-venv/bin/semgrep" "$GATE_TOOLS_BIN/semgrep"
          test -x "$GATE_TOOLS_BIN/gitleaks"
          test -x "$GATE_TOOLS_BIN/semgrep"

      - name: Run Gitleaks secrets and local Semgrep SAST
        shell: bash
        run: bash suite/scripts/run_security_scans.sh

      - name: Scan dependency manifests and configuration via pinned Trivy
        id: trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          scan-type: 'fs'
          scan-ref: 'target'
          scanners: 'vuln,misconfig'
          format: 'json'
          output: ${{ runner.temp }}/qdip-security-private/trivy.json
          exit-code: '0'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
        env:
          TRIVY_DISABLE_TELEMETRY: 'true'
          TRIVY_OFFLINE_SCAN: 'true'

      - name: Record scanner completion without leaking reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.trivy.outcome }}" == success ]] && [[ -s "$GATE_REPORT_DIR/trivy.json" ]]; then
            printf '0\n' > "$GATE_REPORT_DIR/trivy.exit"
          else
            printf '99\n' > "$GATE_REPORT_DIR/trivy.exit"
          fi

      - name: Evaluate source-bound deterministic evidence (fail closed)
        if: always()
        run: node suite/scripts/deterministic_security_gate.mjs

      - name: Upload sanitized public verdict only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qdip-deterministic-security-verdict
          path: ${{ runner.temp }}/qdip-security-public/verdict.json
          if-no-files-found: warn
          retention-days: 14
