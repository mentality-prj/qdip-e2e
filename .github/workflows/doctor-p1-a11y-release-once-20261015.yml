name: Doctor P1 accessibility production release gate one-shot
on:
  push:
    branches: [test/doctor-p1-a11y-merged-release-20261015]
    paths: [.github/workflows/doctor-p1-a11y-release-once-20261015.yml]
permissions:
  contents: read
jobs:
  release-gate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing authorized Zitadel account secret binding
        env:
          TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
          TEST_PASSWORD_EXISTS: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEST_LOGIN"
          test "$TEST_PASSWORD_EXISTS" = 'true'
      - name: Verify browser script syntax
        run: |
          node --check scripts/doctor_p1_mobile_stage.mjs
          node --check scripts/doctor_p1_repair_live_user.mjs
      - name: Install isolated Chromium
        run: |
          mkdir -p /tmp/doctor-p1-release
          cp scripts/doctor_p1_mobile_stage.mjs scripts/doctor_p1_repair_live_user.mjs /tmp/doctor-p1-release/
          cd /tmp/doctor-p1-release
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Independent production mobile browser and accessibility
        run: |
          cd /tmp/doctor-p1-release
          node doctor_p1_mobile_stage.mjs
      - name: Genuine Zitadel browser and independently verified CP-SAT repairs
        env:
          QDIP_E2E_ZITADEL_TEST_LOGIN: ${{ secrets.QDIP_E2E_ZITADEL_TEST_LOGIN }}
          QDIP_E2E_ZITADEL_TEST_PASSWORD: ${{ secrets.QDIP_E2E_ZITADEL_TEST_PASSWORD }}
        run: |
          cd /tmp/doctor-p1-release
          node doctor_p1_repair_live_user.mjs
