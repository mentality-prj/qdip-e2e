name: RR Core focused qualification
on:
  push:
    branches: [qa/rr-core-focused-qualification]
    paths: [.github/workflows/qa-rr-core.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    if: github.event.repository.private == false
    steps:
      - name: Checkout private Core read-only at pinned immutable SHA
        uses: actions/checkout@v4
        with:
          repository: qdip-ai/qdip-core
          ref: 30c764c2074e67d546761cf9af0406fd29020ecc
          token: ${{ secrets.QDIP_READ_TOKEN }}
          persist-credentials: false
          path: core
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core dependencies with private output suppressed
        run: |
          set +e
          python -m pip install -e './core[dev]' > "$RUNNER_TEMP/rr-pip.log" 2>&1
          result=$?
          echo "RR_INSTALL_EXIT=$result"
          exit "$result"
      - name: Core Python bytecode syntax
        run: |
          python -m compileall -q core/app/plugins/readiness_recovery core/app/api/v1/readiness_recovery.py core/tests/plugins/readiness_recovery
          echo 'RR_SYNTAX=PASS'
      - name: Research mathematical regression tests
        working-directory: core
        run: |
          set +e
          python -m pytest -q tests/plugins/readiness_recovery/test_research_math.py tests/plugins/readiness_recovery/test_research_legacy_engine.py > "$RUNNER_TEMP/rr-math.log" 2>&1
          result=$?
          echo "RR_MATH_TESTS_EXIT=$result"
          exit "$result"
      - name: Core presentation and identity audit tests
        working-directory: core
        run: |
          set +e
          python -m pytest -q tests/plugins/readiness_recovery/test_presentation.py tests/plugins/readiness_recovery/test_actor_assertion.py > "$RUNNER_TEMP/rr-presentation.log" 2>&1
          result=$?
          echo "RR_PRESENTATION_TESTS_EXIT=$result"
          exit "$result"
      - name: Core Ruff quality
        working-directory: core
        run: |
          set +e
          python -m ruff check . > "$RUNNER_TEMP/rr-ruff.log" 2>&1
          result=$?
          echo "RR_RUFF_EXIT=$result"
          exit "$result"
      - name: Core mypy quality
        working-directory: core
        run: |
          set +e
          python -m mypy --show-error-codes app/plugins/readiness_recovery/research_math.py app/plugins/readiness_recovery/research_legacy_engine.py app/plugins/readiness_recovery/research_legacy_domain.py app/plugins/readiness_recovery/actor_assertion.py app/plugins/readiness_recovery/presentation.py app/api/v1/readiness_recovery.py > "$RUNNER_TEMP/rr-mypy.log" 2>&1
          result=$?
          if [[ "$result" -ne 0 ]]; then
            # Only file+line+diagnostic-code appear in PUBLIC logs. The actual
            # private messages and source never leave the ephemeral runner.
            python - <<'PY'
          import os
          import re
          from pathlib import Path
          entries = Path(os.environ["RUNNER_TEMP"], "rr-mypy.log").read_text(encoding="utf-8")
          found = False
          for line in entries.splitlines():
              prefix, sep, message = line.partition(": error: ")
              match = re.match(r"^(app/[A-Za-z0-9_./-]+[.]py):([0-9]+)(?::[0-9]+)?$", prefix)
              if sep and match:
                  category = message.rsplit(" [", 1)[-1].removesuffix("]") if message.endswith("]") else "uncategorized"
                  print(f"MYPY_DIAG={match.group(1)}:{match.group(2)}:{category}")
                  found = True
          if not found:
              print("MYPY_DIAG=UNCLASSIFIED_FAILURE")
          PY
          fi
          echo "RR_MYPY_EXIT=$result"
          exit "$result"
      - name: All RR plugin unit and contract tests (native Mongo is separate)
        working-directory: core
        run: |
          set +e
          python -m pytest -q tests/plugins/readiness_recovery --ignore=tests/plugins/readiness_recovery/test_mongo_integration.py > "$RUNNER_TEMP/rr-all.log" 2>&1
          result=$?
          echo "RR_FULL_PLUGIN_UNIT_TESTS_EXIT=$result"
          exit "$result"
      - name: Qualification marker (no private source or logs)
        run: echo 'RR_CORE_FOCUSED=PASS; LIVE_MONGO_AND_ZITADEL_NOT_TESTED'
