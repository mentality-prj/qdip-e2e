name: Validate public E2E suite

on:
  push:
    branches: [main, 'test/**', 'fix/**']
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'tests/**'
      - 'fixtures/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qdip-e2e-static-lint
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check workflows with actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
      - name: Validate standalone E2E Python sources and JSON fixture
        run: |
          python -m compileall -q scripts tests
          python -m json.tool fixtures/rr_reference_api_v1.json >/dev/null
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone Playwright TypeScript parse
        run: |
          node --experimental-strip-types --check scripts/rr_plugin_browser.spec.ts
          node --check scripts/doctor_p1_repair_live_user.mjs
          node --check scripts/doctor_roleless_qa1_live.mjs
          node --check scripts/doctor_p1_mobile_stage.mjs
          node --experimental-strip-types --check scripts/rr_oidc_session_browser.spec.ts
          node --experimental-strip-types --check scripts/rr_real_playwright.config.ts
          node --check scripts/mock_zitadel.mjs
          node --experimental-strip-types --check scripts/rr_oidc_exchange_browser.spec.ts
          node --experimental-strip-types --check scripts/rr_oidc_exchange_playwright.config.ts
      - name: Validate fail-closed browser result checker
        run: python -m unittest discover -s scripts -p 'test_e2e_*.py' -v
      - name: Validate SHA-pinned watcher and stale-run result isolation
        run: python -m unittest discover -s tests -p 'test_runner_integrity.py' -v
