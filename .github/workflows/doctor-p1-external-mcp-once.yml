name: Doctor P1 external OAuth gateway staging one-shot
on:
  push:
    branches: [test/doctor-p1-external-mcp-metadata-20261015]
    paths: [.github/workflows/doctor-p1-external-mcp-once.yml]
permissions:
  contents: read
jobs:
  external-mcp:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real Railway external MCP gateway security assertions
        env:
          DOCTOR_P1_MCP_ORIGIN: https://doctor-p1-external-oauth-stage-20261015-production.up.railway.app
        run: |
          node --check scripts/doctor_p1_external_mcp.mjs
          node scripts/doctor_p1_external_mcp.mjs
