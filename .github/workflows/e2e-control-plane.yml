name: E2E public control-plane quality

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - 'fix/**'
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  runner-quality:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse all E2E Python files
        run: python -m compileall -q scripts tests
      - name: Check all runner shell syntax
        run: |
          set -euo pipefail
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
      - name: Exercise SHA-pinned provenance and stale-run rejection
        run: python -m unittest discover -s tests -p 'test_runner_integrity.py' -v
      - name: Validate GitHub workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 .github/workflows/*.yml
